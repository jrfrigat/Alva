name: Release

# Runs when a version tag is pushed, e.g. v0.1.0: builds and tests, builds the application image,
# pushes it to Docker Hub and creates a GitHub Release. The version comes from the tag (v1.2.3 -> 1.2.3).
# Publishing to Docker Hub happens only when the repository variable DOCKERHUB_USERNAME is set, so the
# release still builds and records itself without Docker Hub configured.

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore Alva.slnx
      - run: dotnet build Alva.slnx -c Release --no-restore
      - run: dotnet test Alva.slnx -c Release --no-build

      - name: Build container image
        run: docker build -t alva:${{ steps.version.outputs.value }} .

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        run: |
          image="docker.io/${{ vars.DOCKERHUB_USERNAME }}/alva"
          version="${{ steps.version.outputs.value }}"
          docker tag "alva:${version}" "${image}:${version}"
          docker tag "alva:${version}" "${image}:latest"
          docker push "${image}:${version}"
          docker push "${image}:latest"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
