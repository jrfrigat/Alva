# Copy to docker-compose.override.yml and set NPM_PROXY_IP in .env.
# Nginx Proxy Manager must already be connected to proxy_network.
services:
  app:
    container_name: alva-app
    environment:
      ReverseProxy__Enabled: "true"
      ReverseProxy__KnownProxy: ${NPM_PROXY_IP:?Set NPM_PROXY_IP to the NPM address on proxy_network}
    networks:
      default: {}
      proxy_network:
        aliases:
          - alva-app
  db:
    container_name: alva-db

networks:
  proxy_network:
    external: true
    name: proxy_network
