# Copy to docker-compose.override.yml. Set NPM_PROXY_HOST if NPM uses a different name.
# Nginx Proxy Manager must already be connected to proxy_network.
services:
  app:
    container_name: alva-app
    environment:
      ReverseProxy__Enabled: "true"
      ReverseProxy__KnownProxy: ${NPM_PROXY_HOST:-${NPM_PROXY_IP:-nginx-proxy}}
    networks:
      default: {}
      proxy_network:
        aliases:
          - alva-app
  db:
    container_name: alva-db

networks:
  proxy_network:
    external: true
    name: proxy_network
