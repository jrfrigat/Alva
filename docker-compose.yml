name: alva

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alva}
      POSTGRES_USER: ${POSTGRES_USER:-alva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  app:
    image: ${ALVA_IMAGE:-alva:latest}
    build:
      context: .
      dockerfile: build/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Alva: "Host=db;Port=5432;Database=${POSTGRES_DB:-alva};Username=${POSTGRES_USER:-alva};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      DataProtection__KeysPath: /var/alva/keys
    volumes:
      - protection-keys:/var/alva/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["https"]
    environment:
      ALVA_DOMAIN: ${ALVA_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  protection-keys:
  caddy-data:
  caddy-config:
